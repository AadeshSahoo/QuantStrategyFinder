[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstrategyfinder"
version = "0.2.0"
description = "Research-only strategy discovery, backtesting, and honest validation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "QuantStrategyFinder" }]
dependencies = [
  "pandas>=2.2.0,<3",
  "numpy>=1.26.0,<3",
  "yfinance>=0.2.40,<1",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  "streamlit>=1.32,<2",
  "plotly>=5.18,<6",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
  "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]

[project.scripts]
qsf = "quantstrategyfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: end-to-end tests that download real market data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
